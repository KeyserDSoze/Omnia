version: 2
# Monthly, one grouped pull request per ecosystem. Security updates stay immediate.
updates:
  - package-ecosystem: npm
    directory: /src/mobile
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: [area:quality]
    # Expo SDK packages move together via `npx expo install --fix` on SDK upgrades.
    ignore:
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: "@expo/*"
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: "@types/react"
      - dependency-name: react-native
      - dependency-name: react-native-*
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: [area:quality]
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: [area:quality]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: [area:quality]
    # Node stays on an LTS line (odd majors are not LTS) and nginx on the stable branch
    # (odd minors are mainline): those moves are deliberate, manual upgrades.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: nginxinc/nginx-unprivileged
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      docker:
        patterns: ["*"]
