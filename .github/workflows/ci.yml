name: Omnia CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: xUnit domain and application
        run: dotnet test tests/Omnia.Domain.Tests/Omnia.Domain.Tests.csproj -c Release
      - name: Compile .NET 10 API and offline backfill utility
        run: |
          dotnet build src/backend/Omnia.Api/Omnia.Api.csproj -c Release
          dotnet build src/backend/Omnia.Backfill/Omnia.Backfill.csproj -c Release
          dotnet build src/backend/Omnia.BackfillAudit/Omnia.BackfillAudit.csproj -c Release
          dotnet build src/backend/Omnia.RecoveryAudit/Omnia.RecoveryAudit.csproj -c Release
          dotnet build src/backend/Omnia.ErasurePublisher/Omnia.ErasurePublisher.csproj -c Release
          dotnet build src/backend/Omnia.WitnessAudit/Omnia.WitnessAudit.csproj -c Release
          dotnet build src/backend/Omnia.ErasureDeliveryAudit/Omnia.ErasureDeliveryAudit.csproj -c Release
          dotnet build tests/Omnia.RestoreRehearsal/Omnia.RestoreRehearsal.csproj -c Release
          dotnet build tests/Omnia.UnwitnessedPitrRehearsal/Omnia.UnwitnessedPitrRehearsal.csproj -c Release
          dotnet build tests/Omnia.WitnessPitrRehearsal/Omnia.WitnessPitrRehearsal.csproj -c Release
          dotnet build tests/Omnia.ClaimPitrRehearsal/Omnia.ClaimPitrRehearsal.csproj -c Release
      - name: Recovery audit CLI denies missing external journal and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp "$RUNNER_TEMP/omnia-recovery-audit.XXXXXX")"
          trap 'rm -f "$log"' EXIT
          if env -u OMNIA_RECOVERY_JOURNAL_PATH \
                 -u OMNIA_RECOVERY_CHECKPOINT_PATH \
                 -u OMNIA_RECOVERY_JOURNAL_KEY_PATH \
                 -u OMNIA_RECOVERY_CHECKPOINT_KEY_PATH \
            dotnet run --no-build -c Release \
            --project src/backend/Omnia.RecoveryAudit/Omnia.RecoveryAudit.csproj \
            > "$log" 2>&1; then
            echo "Recovery audit unexpectedly accepted absent external trust files." >&2
            exit 1
          fi
          grep -Fq 'RECOVERY_AUDIT_FAILED' "$log" || {
            echo "Recovery audit failed for an unrelated reason." >&2
            exit 1
          }

      - name: Assert recovery quarantine prevents API startup before database access
        shell: bash
        run: |
          set -euo pipefail
          marker="$(mktemp "$RUNNER_TEMP/omnia-recovery-state.XXXXXX")"
          log="$(mktemp "$RUNNER_TEMP/omnia-recovery-log.XXXXXX")"
          trap 'rm -f "$marker" "$log"' EXIT
          printf 'quarantined\n' > "$marker"
          chmod 600 "$marker"
          if Recovery__AccessStateFile="$marker" ASPNETCORE_ENVIRONMENT=Development \
            dotnet run --no-build --no-launch-profile -c Release \
              --project src/backend/Omnia.Api/Omnia.Api.csproj > "$log" 2>&1; then
            echo "Quarantined API unexpectedly started." >&2
            exit 1
          fi
          grep -Fq 'RECOVERY_QUARANTINED' "$log" || {
            echo "API failed for an unrelated reason; gate was not exercised." >&2
            exit 1
          }
          if ASPNETCORE_ENVIRONMENT=Production \
            dotnet run --no-build --no-launch-profile -c Release \
              --project src/backend/Omnia.Api/Omnia.Api.csproj > "$log" 2>&1; then
            echo "Production API unexpectedly started without release state." >&2
            exit 1
          fi
          grep -Fq 'RECOVERY_QUARANTINED' "$log" || {
            echo "Production mode did not deny missing recovery state." >&2
            exit 1
          }
          printf 'ready\n' > "$marker"
          if Recovery__AccessStateFile="$marker" ASPNETCORE_ENVIRONMENT=Development \
            dotnet run --no-build --no-launch-profile -c Release \
              --project src/backend/Omnia.Api/Omnia.Api.csproj > "$log" 2>&1; then
            echo "Unconfigured API unexpectedly started." >&2
            exit 1
          fi
          grep -Fq 'Database:ConnectionString is required' "$log" || {
            echo "Ready state did not advance to the expected database check." >&2
            exit 1
          }

      # The official MinIO Community Docker image was withdrawn in 2026.
      # SeaweedFS speaks the same S3 Object Lock/versioning protocol and has
      # a maintained official OSS container. This is a SAME-RUNNER test,
      # never offsite custody, user data, or production WORM evidence.
      - name: Start disposable S3-compatible Object Lock service (CI only)
        shell: bash
        run: |
          set -euo pipefail
          access="$(openssl rand -hex 16)"
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$access"
          echo "::add-mask::$secret"
          echo "OMNIA_TEST_S3_ACCESS=$access" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_S3_SECRET=$secret" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_S3_ENDPOINT=http://127.0.0.1:18433" >> "$GITHUB_ENV"
          echo "OMNIA_S3_CI_ONLY=1" >> "$GITHUB_ENV"
          auth="$RUNNER_TEMP/omnia-s3-auth.json"
          jq -nc --arg access "$access" --arg secret "$secret" \
            '{identities:[{name:"ci-s3-admin",
              credentials:[{accessKey:$access,secretKey:$secret}],
              actions:["Admin","Read","Write","List","Tagging"]}]}' > "$auth"
          # The official SeaweedFS entrypoint drops privileges via
          # su-exec seaweed EVEN WHEN docker is started with --user 0.
          # Discover the actual service UID/GID, then grant ONLY that
          # identity read access to this bind-mounted synthetic secret.
          docker pull chrislusf/seaweedfs:4.47 >/dev/null
          seaweed_uid="$(docker run --rm --entrypoint id chrislusf/seaweedfs:4.47 -u seaweed)"
          seaweed_gid="$(docker run --rm --entrypoint id chrislusf/seaweedfs:4.47 -g seaweed)"
          [[ "$seaweed_uid" =~ ^[0-9]+$ && "$seaweed_gid" =~ ^[0-9]+$ ]]
          # Set mode *before* transferring ownership; GitHub runner
          # cannot chmod a file after it belongs to the container UID.
          chmod 400 "$auth"
          sudo chown "$seaweed_uid:$seaweed_gid" "$auth"
          # Keep an exited container for diagnostics; cleanup runs always.
          docker run -d --name omnia-ci-s3-object-lock \
            -v "$auth:/etc/seaweedfs/s3.json:ro" \
            -p 127.0.0.1:18433:8333 \
            chrislusf/seaweedfs:4.47 \
            server -s3 -s3.config=/etc/seaweedfs/s3.json \
              -dir=/data -master.volumeSizeLimitMB=64
          ready=0
          for i in $(seq 1 50); do
            if [[ "$(docker inspect -f '{{.State.Running}}' omnia-ci-s3-object-lock)" != true ]]; then
              echo "S3 container terminated before its health check." >&2
              docker logs --tail 100 omnia-ci-s3-object-lock || true
              exit 1
            fi
            # Unauthorized or signed S3 API responses both prove the
            # socket is accepting HTTP. Never log admin credentials.
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              --connect-timeout 2 http://127.0.0.1:18433/ 2>/dev/null || true)"
            if [[ "$status" =~ ^[245][0-9][0-9]$ ]]; then
              ready=1; break
            fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            docker logs --tail 90 omnia-ci-s3-object-lock || true
            echo "S3 Object Lock service not available." >&2
            exit 1
          fi

      - name: Real S3 Object Lock version-pinned adapter integration tests
        run: dotnet test tests/Omnia.S3ObjectLock.Tests/Omnia.S3ObjectLock.Tests.csproj -c Release
      - name: Stop disposable S3-compatible service
        if: always()
        shell: bash
        run: |
          docker rm -f omnia-ci-s3-object-lock >/dev/null 2>&1 || true
          rm -f -- "$RUNNER_TEMP/omnia-s3-auth.json"


      - name: Start disposable PostgreSQL 17 / pgvector
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          app_password="$(openssl rand -hex 24)"
          retention_password="$(openssl rand -hex 24)"
          backfill_password="$(openssl rand -hex 24)"
          audit_password="$(openssl rand -hex 24)"
          dispatch_password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "::add-mask::$app_password"
          echo "::add-mask::$retention_password"
          echo "::add-mask::$backfill_password"
          echo "::add-mask::$audit_password"
          echo "::add-mask::$dispatch_password"
          echo "OMNIA_TEST_DB=Host=127.0.0.1;Port=15432;Database=omnia_test;Username=omnia;Password=$password" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_APP_DB=Host=127.0.0.1;Port=15432;Database=omnia_test;Username=omnia_app;Password=$app_password" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_RETENTION_DB=Host=127.0.0.1;Port=15432;Database=omnia_test;Username=omnia_retention;Password=$retention_password" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_BACKFILL_DB=Host=127.0.0.1;Port=15432;Database=omnia_test;Username=omnia_backfill;Password=$backfill_password" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_AUDIT_DB=Host=127.0.0.1;Port=15432;Database=omnia_test;Username=omnia_backfill_audit;Password=$audit_password" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_DISPATCH_DB=Host=127.0.0.1;Port=15432;Database=omnia_test;Username=omnia_dispatcher;Password=$dispatch_password" >> "$GITHUB_ENV"
          ring_file="$RUNNER_TEMP/omnia-test-envelope.keyring.json"
          # Synthetic key lives only on this ephemeral runner; never in logs/artifacts.
          ring_key="$(openssl rand -base64 32)"
          jq -nc --arg secret "$ring_key" \
            '{activeKeyId:"ci-v1", keys:{"ci-v1":$secret}}' > "$ring_file"
          chmod 600 "$ring_file"
          echo "OMNIA_TEST_KEYRING_FILE=$ring_file" >> "$GITHUB_ENV"
          docker run -d --rm --name omnia-ci-pg \
            -e POSTGRES_USER=omnia -e POSTGRES_DB=omnia_test \
            -e "POSTGRES_PASSWORD=$password" \
            -p 127.0.0.1:15432:5432 pgvector/pgvector:pg17 \
            -c archive_mode=on \
            -c "archive_command=mkdir -p /tmp/omnia-ci-wal-archive && test ! -f /tmp/omnia-ci-wal-archive/%f && cp %p /tmp/omnia-ci-wal-archive/%f" \
            -c archive_timeout=60s
          for i in $(seq 1 60); do
            if docker exec omnia-ci-pg pg_isready -U omnia -d omnia_test; then break; fi
            sleep 2
          done
          docker exec omnia-ci-pg pg_isready -U omnia -d omnia_test
          docker exec -i omnia-ci-pg psql -v ON_ERROR_STOP=1 \
            -U omnia -d omnia_test -v app_password="$app_password" -v retention_password="$retention_password" -v backfill_password="$backfill_password" -v audit_password="$audit_password" -v dispatch_password="$dispatch_password" <<'SQL'
          SELECT format(
            'CREATE ROLE omnia_app LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE',
            :'app_password'
          ) \gexec
          SELECT format(
            'CREATE ROLE omnia_retention LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT',
            :'retention_password'
          ) \gexec
          SELECT format(
            'CREATE ROLE omnia_backfill LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT',
            :'backfill_password'
          ) \gexec
          SELECT format(
            'CREATE ROLE omnia_backfill_audit LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT',
            :'audit_password'
          ) \gexec
          SELECT format(
            'CREATE ROLE omnia_dispatcher LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT',
            :'dispatch_password'
          ) \gexec
          SQL
      - name: Start independent PostgreSQL 17 erasure witness (synthetic CI only)
        shell: bash
        run: |
          set -euo pipefail
          # Different PostgreSQL container, port, cluster system identifier
          # and PGDATA: never mount the primary DB volume into the witness.
          witness_admin="$(openssl rand -hex 24)"
          witness_writer="$(openssl rand -hex 24)"
          witness_reader="$(openssl rand -hex 24)"
          intent_writer="$(openssl rand -hex 24)"
          intent_reader="$(openssl rand -hex 24)"
          echo "::add-mask::$witness_admin"
          echo "::add-mask::$witness_writer"
          echo "::add-mask::$witness_reader"
          echo "::add-mask::$intent_writer"
          echo "::add-mask::$intent_reader"
          echo "OMNIA_TEST_INTENT_WRITER_DB=Host=127.0.0.1;Port=15436;Database=omnia_witness;Username=omnia_witness_intent_writer;Password=$intent_writer" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_INTENT_READER_DB=Host=127.0.0.1;Port=15436;Database=omnia_witness;Username=omnia_witness_intent_reader;Password=$intent_reader" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_WITNESS_ADMIN_DB=Host=127.0.0.1;Port=15436;Database=omnia_witness;Username=omnia;Password=$witness_admin" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_WITNESS_WRITER_DB=Host=127.0.0.1;Port=15436;Database=omnia_witness;Username=omnia_witness_writer;Password=$witness_writer" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_WITNESS_READER_DB=Host=127.0.0.1;Port=15436;Database=omnia_witness;Username=omnia_witness_reader;Password=$witness_reader" >> "$GITHUB_ENV"
          docker run -d --rm --name omnia-ci-erasure-witness \
            -e POSTGRES_USER=omnia -e POSTGRES_DB=omnia_witness \
            -e "POSTGRES_PASSWORD=$witness_admin" \
            -p 127.0.0.1:15436:5432 postgres:17 \
            -c archive_mode=on \
            -c "archive_command=mkdir -p /tmp/omnia-ci-witness-wal-archive && test ! -f /tmp/omnia-ci-witness-wal-archive/%f && cp %p /tmp/omnia-ci-witness-wal-archive/%f" \
            -c archive_timeout=60s
          for i in $(seq 1 60); do
            if docker exec omnia-ci-erasure-witness \
               pg_isready -U omnia -d omnia_witness >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec omnia-ci-erasure-witness pg_isready -U omnia -d omnia_witness
          docker exec -i omnia-ci-erasure-witness psql -X -v ON_ERROR_STOP=1 \
            -U omnia -d omnia_witness \
            -v writer_password="$witness_writer" \
            -v reader_password="$witness_reader" \
            -v intent_writer_password="$intent_writer" \
            -v intent_reader_password="$intent_reader" <<'SQL'
          SELECT format(
            'CREATE ROLE omnia_witness_writer LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT',
            :'writer_password'
          ) \gexec
          SELECT format(
            'CREATE ROLE omnia_witness_reader LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT',
            :'reader_password'
          ) \gexec
          SELECT format(
            'CREATE ROLE omnia_witness_intent_writer LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT',
            :'intent_writer_password'
          ) \gexec
          SELECT format(
            'CREATE ROLE omnia_witness_intent_reader LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT',
            :'intent_reader_password'
          ) \gexec
          SQL
          docker exec -i omnia-ci-erasure-witness psql -X -v ON_ERROR_STOP=1 \
            -U omnia -d omnia_witness < tests/restore/independent-witness.sql
          primary_id="$(docker exec omnia-ci-pg psql -U omnia -d omnia_test -Atqc \
            'SELECT system_identifier FROM pg_control_system()')"
          witness_id="$(docker exec omnia-ci-erasure-witness psql \
            -U omnia -d omnia_witness -Atqc \
            'SELECT system_identifier FROM pg_control_system()')"
          [[ -n "$primary_id" && -n "$witness_id" && "$primary_id" != "$witness_id" ]] || {
            echo "Witness reused the primary PostgreSQL cluster identity." >&2
            exit 1
          }
      - name: Start THIRD independent PostgreSQL 17 witness checkpoint anchor (CI only)
        shell: bash
        run: |
          set -euo pipefail
          # Third, distinct PGDATA and database identity; still one ephemeral CI host.
          anchor_admin="$(openssl rand -hex 24)"
          anchor_writer="$(openssl rand -hex 24)"
          anchor_reader="$(openssl rand -hex 24)"
          echo "::add-mask::$anchor_admin"
          echo "::add-mask::$anchor_writer"
          echo "::add-mask::$anchor_reader"
          echo "OMNIA_TEST_ANCHOR_ADMIN_DB=Host=127.0.0.1;Port=15438;Database=omnia_anchor;Username=omnia;Password=$anchor_admin" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_ANCHOR_WRITER_DB=Host=127.0.0.1;Port=15438;Database=omnia_anchor;Username=omnia_anchor_writer;Password=$anchor_writer" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_ANCHOR_READER_DB=Host=127.0.0.1;Port=15438;Database=omnia_anchor;Username=omnia_anchor_reader;Password=$anchor_reader" >> "$GITHUB_ENV"
          docker run -d --rm --name omnia-ci-witness-anchor \
            -e POSTGRES_USER=omnia -e POSTGRES_DB=omnia_anchor \
            -e "POSTGRES_PASSWORD=$anchor_admin" \
            -p 127.0.0.1:15438:5432 postgres:17 \
            -c archive_mode=on \
            -c "archive_command=mkdir -p /tmp/omnia-ci-third-claim-wal-archive && test ! -f /tmp/omnia-ci-third-claim-wal-archive/%f && cp %p /tmp/omnia-ci-third-claim-wal-archive/%f" \
            -c archive_timeout=60s
          for i in $(seq 1 60); do
            if docker exec omnia-ci-witness-anchor \
              pg_isready -U omnia -d omnia_anchor >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec omnia-ci-witness-anchor pg_isready -U omnia -d omnia_anchor
          docker exec -i omnia-ci-witness-anchor psql -X -v ON_ERROR_STOP=1 \
            -U omnia -d omnia_anchor \
            -v writer_password="$anchor_writer" \
            -v reader_password="$anchor_reader" <<'SQL'
          SELECT format(
            'CREATE ROLE omnia_anchor_writer LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT',
            :'writer_password'
          ) \gexec
          SELECT format(
            'CREATE ROLE omnia_anchor_reader LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT',
            :'reader_password'
          ) \gexec
          SQL
          docker exec -i omnia-ci-witness-anchor psql -X -v ON_ERROR_STOP=1 \
            -U omnia -d omnia_anchor < tests/restore/independent-anchor.sql
          # A second DATABASE on the THIRD PGDATA isolates intent checkpoint
          # authority from the completed erasure checkpoint (separate keys
          # and domain-separated HMAC formats, same non-production CI host).
          docker exec omnia-ci-witness-anchor psql -X -v ON_ERROR_STOP=1 \
            -U omnia -d postgres -c 'CREATE DATABASE omnia_intent_anchor' >/dev/null
          docker exec -i omnia-ci-witness-anchor psql -X -v ON_ERROR_STOP=1 \
            -U omnia -d omnia_intent_anchor < tests/restore/independent-anchor.sql
          echo "OMNIA_TEST_INTENT_ANCHOR_ADMIN_DB=Host=127.0.0.1;Port=15438;Database=omnia_intent_anchor;Username=omnia;Password=$anchor_admin" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_INTENT_ANCHOR_WRITER_DB=Host=127.0.0.1;Port=15438;Database=omnia_intent_anchor;Username=omnia_anchor_writer;Password=$anchor_writer" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_INTENT_ANCHOR_READER_DB=Host=127.0.0.1;Port=15438;Database=omnia_intent_anchor;Username=omnia_anchor_reader;Password=$anchor_reader" >> "$GITHUB_ENV"
          # Dedicated HMAC head for the CI-only preflight regression: xUnit
          # runs different test classes concurrently, so NEVER share the
          # issuer's checkpoint/secret with the generic intent-anchor suite.
          docker exec omnia-ci-witness-anchor psql -X -v ON_ERROR_STOP=1 \
            -U omnia -d postgres -c 'CREATE DATABASE omnia_preflight_anchor' >/dev/null
          docker exec -i omnia-ci-witness-anchor psql -X -v ON_ERROR_STOP=1 \
            -U omnia -d omnia_preflight_anchor < tests/restore/independent-anchor.sql
          echo "OMNIA_TEST_PREFLIGHT_ANCHOR_ADMIN_DB=Host=127.0.0.1;Port=15438;Database=omnia_preflight_anchor;Username=omnia;Password=$anchor_admin" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_PREFLIGHT_ANCHOR_WRITER_DB=Host=127.0.0.1;Port=15438;Database=omnia_preflight_anchor;Username=omnia_anchor_writer;Password=$anchor_writer" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_PREFLIGHT_ANCHOR_READER_DB=Host=127.0.0.1;Port=15438;Database=omnia_preflight_anchor;Username=omnia_anchor_reader;Password=$anchor_reader" >> "$GITHUB_ENV"
          # The attempt-consumption authority lives in another database on
          # the surviving THIRD PGDATA. Its writer cannot change checkpoint
          # heads, raw tables, or completed-erasure receipts.
          claim_writer_password="$(openssl rand -hex 24)"
          claim_reader_password="$(openssl rand -hex 24)"
          echo "::add-mask::$claim_writer_password"
          echo "::add-mask::$claim_reader_password"
          docker exec -i omnia-ci-witness-anchor psql -X -v ON_ERROR_STOP=1 \
            -U omnia -d postgres \
            -v claim_writer_password="$claim_writer_password" \
            -v claim_reader_password="$claim_reader_password" <<'SQL'
          SELECT format(
            'CREATE ROLE omnia_claim_writer LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT',
            :'claim_writer_password'
          ) \gexec
          SELECT format(
            'CREATE ROLE omnia_claim_reader LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT',
            :'claim_reader_password'
          ) \gexec
          SQL
          docker exec omnia-ci-witness-anchor psql -X -v ON_ERROR_STOP=1 \
            -U omnia -d postgres -c 'CREATE DATABASE omnia_claim_preflight_anchor' >/dev/null
          docker exec -i omnia-ci-witness-anchor psql -X -v ON_ERROR_STOP=1 \
            -U omnia -d omnia_claim_preflight_anchor < tests/restore/independent-anchor.sql
          echo "OMNIA_TEST_CLAIM_ANCHOR_WRITER_DB=Host=127.0.0.1;Port=15438;Database=omnia_claim_preflight_anchor;Username=omnia_anchor_writer;Password=$anchor_writer" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_CLAIM_ANCHOR_READER_DB=Host=127.0.0.1;Port=15438;Database=omnia_claim_preflight_anchor;Username=omnia_anchor_reader;Password=$anchor_reader" >> "$GITHUB_ENV"
          docker exec omnia-ci-witness-anchor psql -X -v ON_ERROR_STOP=1 \
            -U omnia -d postgres -c 'CREATE DATABASE omnia_execution_claims' >/dev/null
          docker exec -i omnia-ci-witness-anchor psql -X -v ON_ERROR_STOP=1 \
            -U omnia -d omnia_execution_claims < tests/restore/preerase-execution-claims.sql
          echo "OMNIA_TEST_EXECUTION_CLAIM_ADMIN_DB=Host=127.0.0.1;Port=15438;Database=omnia_execution_claims;Username=omnia;Password=$anchor_admin" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_EXECUTION_CLAIM_WRITER_DB=Host=127.0.0.1;Port=15438;Database=omnia_execution_claims;Username=omnia_claim_writer;Password=$claim_writer_password" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_EXECUTION_CLAIM_READER_DB=Host=127.0.0.1;Port=15438;Database=omnia_execution_claims;Username=omnia_claim_reader;Password=$claim_reader_password" >> "$GITHUB_ENV"
          # A dedicated HMAC pre-intent head for the FOURTH-PGDATA test;
          # no xUnit signer-key overlap with other checkpoint databases.
          docker exec omnia-ci-witness-anchor psql -X -v ON_ERROR_STOP=1 \
            -U omnia -d postgres -c 'CREATE DATABASE omnia_fourth_intent_anchor' >/dev/null
          docker exec -i omnia-ci-witness-anchor psql -X -v ON_ERROR_STOP=1 \
            -U omnia -d omnia_fourth_intent_anchor < tests/restore/independent-anchor.sql
          echo "OMNIA_TEST_FOURTH_ANCHOR_WRITER_DB=Host=127.0.0.1;Port=15438;Database=omnia_fourth_intent_anchor;Username=omnia_anchor_writer;Password=$anchor_writer" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_FOURTH_ANCHOR_READER_DB=Host=127.0.0.1;Port=15438;Database=omnia_fourth_intent_anchor;Username=omnia_anchor_reader;Password=$anchor_reader" >> "$GITHUB_ENV"
          source_id="$(docker exec omnia-ci-pg psql -U omnia -d omnia_test -Atqc \
            'SELECT system_identifier FROM pg_control_system()')"
          witness_id="$(docker exec omnia-ci-erasure-witness psql \
            -U omnia -d omnia_witness -Atqc \
            'SELECT system_identifier FROM pg_control_system()')"
          anchor_id="$(docker exec omnia-ci-witness-anchor psql \
            -U omnia -d omnia_anchor -Atqc \
            'SELECT system_identifier FROM pg_control_system()')"
          [[ -n "$anchor_id" && "$anchor_id" != "$source_id" && "$anchor_id" != "$witness_id" ]] || {
            echo "Anchor must use independent PostgreSQL PGDATA." >&2
            exit 1
          }
      - name: Start FOURTH PostgreSQL PGDATA one-shot claim replay fence (synthetic CI only)
        shell: bash
        run: |
          set -euo pipefail
          fourth_admin="$(openssl rand -hex 24)"
          fourth_writer="$(openssl rand -hex 24)"
          fourth_reader="$(openssl rand -hex 24)"
          echo "::add-mask::$fourth_admin"
          echo "::add-mask::$fourth_writer"
          echo "::add-mask::$fourth_reader"
          docker run -d --rm --name omnia-ci-fourth-claim-fence \
            -e POSTGRES_USER=omnia -e POSTGRES_DB=omnia_fourth_claims \
            -e "POSTGRES_PASSWORD=$fourth_admin" \
            -p 127.0.0.1:15440:5432 postgres:17 \
            -c archive_mode=on \
            -c "archive_command=mkdir -p /tmp/omnia-ci-fourth-claim-wal-archive && test ! -f /tmp/omnia-ci-fourth-claim-wal-archive/%f && cp %p /tmp/omnia-ci-fourth-claim-wal-archive/%f" \
            -c archive_timeout=60s
          for i in $(seq 1 60); do
            if docker exec omnia-ci-fourth-claim-fence \
              pg_isready -U omnia -d omnia_fourth_claims >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec omnia-ci-fourth-claim-fence pg_isready -U omnia -d omnia_fourth_claims
          docker exec -i omnia-ci-fourth-claim-fence psql -X -v ON_ERROR_STOP=1 \
            -U omnia -d omnia_fourth_claims \
            -v writer_password="$fourth_writer" \
            -v reader_password="$fourth_reader" <<'SQL'
          SELECT format(
            'CREATE ROLE omnia_claim_writer LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT',
            :'writer_password'
          ) \gexec
          SELECT format(
            'CREATE ROLE omnia_claim_reader LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT',
            :'reader_password'
          ) \gexec
          SQL
          docker exec -i omnia-ci-fourth-claim-fence psql -X -v ON_ERROR_STOP=1 \
            -U omnia -d omnia_fourth_claims < tests/restore/preerase-execution-claims.sql
          echo "OMNIA_TEST_FOURTH_CLAIM_ADMIN_DB=Host=127.0.0.1;Port=15440;Database=omnia_fourth_claims;Username=omnia;Password=$fourth_admin" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_FOURTH_CLAIM_WRITER_DB=Host=127.0.0.1;Port=15440;Database=omnia_fourth_claims;Username=omnia_claim_writer;Password=$fourth_writer" >> "$GITHUB_ENV"
          echo "OMNIA_TEST_FOURTH_CLAIM_READER_DB=Host=127.0.0.1;Port=15440;Database=omnia_fourth_claims;Username=omnia_claim_reader;Password=$fourth_reader" >> "$GITHUB_ENV"
          source_id="$(docker exec omnia-ci-pg psql -U omnia -d omnia_test -Atqc 'SELECT system_identifier FROM pg_control_system()')"
          witness_id="$(docker exec omnia-ci-erasure-witness psql -U omnia -d omnia_witness -Atqc 'SELECT system_identifier FROM pg_control_system()')"
          third_id="$(docker exec omnia-ci-witness-anchor psql -U omnia -d omnia_anchor -Atqc 'SELECT system_identifier FROM pg_control_system()')"
          fourth_id="$(docker exec omnia-ci-fourth-claim-fence psql -U omnia -d omnia_fourth_claims -Atqc 'SELECT system_identifier FROM pg_control_system()')"
          [[ -n "$fourth_id" && "$fourth_id" != "$source_id" &&
             "$fourth_id" != "$witness_id" && "$fourth_id" != "$third_id" ]] || {
            echo "Fourth claim fence reused an existing physical PGDATA." >&2
            exit 1
          }
      - name: xUnit real PostgreSQL integration
        run: dotnet test tests/Omnia.Integration.Tests/Omnia.Integration.Tests.csproj -c Release
      - name: Isolated witness publisher CLI denies unsafe mode and confirms a test-only scan
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp "$RUNNER_TEMP/omnia-publisher.XXXXXX")"
          trap 'rm -f "$log"' EXIT
          if env -u OMNIA_ERASURE_PUBLISHER_CI_ONLY \
             dotnet run --no-build -c Release \
               --project src/backend/Omnia.ErasurePublisher/Omnia.ErasurePublisher.csproj \
               -- --once > "$log" 2>&1; then
            echo "Witness publisher unexpectedly accepted unapproved mode." >&2
            exit 1
          fi
          grep -Fq 'ERASURE_PUBLISHER_DENIED' "$log" || {
            echo "Publisher denial was not verified." >&2
            exit 1
          }
          OMNIA_ERASURE_PUBLISHER_CI_ONLY=1 \
            dotnet run --no-build -c Release \
              --project src/backend/Omnia.ErasurePublisher/Omnia.ErasurePublisher.csproj \
              -- --once > "$log" 2>&1
          grep -Fq 'ERASURE_PUBLISHER_CYCLE_CONFIRMED' "$log" || {
            echo "Witness publisher did not confirm delivery." >&2
            exit 1
          }
      - name: Live source outbox must have exact witnessed receipts after publisher
        shell: bash
        run: |
          set -euo pipefail
          project=src/backend/Omnia.ErasureDeliveryAudit/Omnia.ErasureDeliveryAudit.csproj
          log="$(mktemp "$RUNNER_TEMP/omnia-live-audit.XXXXXX")"
          trap 'rm -f "$log"' EXIT
          if env -u OMNIA_ERASURE_LIVE_AUDIT_CI_ONLY \
             dotnet run --no-build -c Release --project "$project" -- --all > "$log" 2>&1; then
            echo "Live delivery audit accepted unapproved mode." >&2
            exit 1
          fi
          grep -Fq 'ERASURE_LIVE_DELIVERY_DENIED' "$log"
          if OMNIA_ERASURE_LIVE_AUDIT_CI_ONLY=1 \
             OMNIA_TEST_WITNESS_READER_DB="$OMNIA_TEST_WITNESS_WRITER_DB" \
             dotnet run --no-build -c Release --project "$project" -- --all > "$log" 2>&1; then
            echo "Live delivery audit accepted witness writer identity." >&2
            exit 1
          fi
          grep -Fq 'ERASURE_LIVE_DELIVERY_DENIED' "$log"
          if OMNIA_ERASURE_LIVE_AUDIT_CI_ONLY=1 \
             OMNIA_TEST_DISPATCH_DB="$OMNIA_TEST_APP_DB" \
             dotnet run --no-build -c Release --project "$project" -- --all > "$log" 2>&1; then
            echo "Live delivery audit accepted application SQL identity." >&2
            exit 1
          fi
          grep -Fq 'ERASURE_LIVE_DELIVERY_DENIED' "$log"
          OMNIA_ERASURE_LIVE_AUDIT_CI_ONLY=1 \
             dotnet run --no-build -c Release --project "$project" -- --all > "$log" 2>&1
          grep -Fq 'ERASURE_LIVE_DELIVERY_CONFIRMED' "$log"
      - name: HMAC witness anchor requires private external checkpoint and consistent reader
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp "$RUNNER_TEMP/omnia-witness-audit.XXXXXX")"
          private="$(mktemp -d "$RUNNER_TEMP/omnia-witness-anchor.XXXXXX")"
          trap 'rm -f "$log"; rm -rf "$private"' EXIT
          chmod 700 "$private"
          openssl rand 32 > "$private/key"
          chmod 600 "$private/key"
          export OMNIA_WITNESS_CHECKPOINT_KEY_PATH="$private/key"
          export OMNIA_WITNESS_CHECKPOINT_PATH="$private/anchor"
          project=src/backend/Omnia.WitnessAudit/Omnia.WitnessAudit.csproj
          if env -u OMNIA_WITNESS_AUDIT_CI_ONLY \
             dotnet run --no-build -c Release --project "$project" -- --issue > "$log" 2>&1; then
            echo "Witness checkpoint issuer allowed unapproved execution." >&2
            exit 1
          fi
          grep -Fq 'WITNESS_CHECKPOINT_DENIED' "$log"
          export OMNIA_WITNESS_AUDIT_CI_ONLY=1
          if dotnet run --no-build -c Release --project "$project" -- --verify > "$log" 2>&1; then
            echo "Witness checkpoint audit accepted an absent anchor." >&2
            exit 1
          fi
          grep -Fq 'WITNESS_CHECKPOINT_DENIED' "$log"
          dotnet run --no-build -c Release --project "$project" -- --issue > "$log" 2>&1
          grep -Fq 'WITNESS_CHECKPOINT_ISSUED' "$log"
          dotnet run --no-build -c Release --project "$project" -- --verify > "$log" 2>&1
          grep -Fq 'WITNESS_CHECKPOINT_VERIFIED' "$log"
          if dotnet run --no-build -c Release --project "$project" -- --issue > "$log" 2>&1; then
            echo "Witness checkpoint issuer overwrote an existing anchor." >&2
            exit 1
          fi
          grep -Fq 'WITNESS_CHECKPOINT_DENIED' "$log"
          cp -p "$private/anchor" "$private/saved"
          printf 'truncated' > "$private/anchor"
          if dotnet run --no-build -c Release --project "$project" -- --verify > "$log" 2>&1; then
            echo "Witness audit accepted a truncated anchor." >&2
            exit 1
          fi
          grep -Fq 'WITNESS_CHECKPOINT_DENIED' "$log"
          mv "$private/saved" "$private/anchor"
          if OMNIA_TEST_WITNESS_READER_DB="$OMNIA_TEST_WITNESS_WRITER_DB" \
             dotnet run --no-build -c Release --project "$project" -- --verify > "$log" 2>&1; then
            echo "Witness audit accepted a writer as reader." >&2
            exit 1
          fi
          grep -Fq 'WITNESS_CHECKPOINT_DENIED' "$log"
          dotnet run --no-build -c Release --project "$project" -- --verify > "$log" 2>&1
          grep -Fq 'WITNESS_CHECKPOINT_VERIFIED' "$log"
      - name: Physical witness WAL PITR must be rejected by surviving third-cluster anchor
        shell: bash
        run: bash tests/restore/physical-witness-pitr-rehearsal.sh
      - name: Restore rehearsal — real PostgreSQL dump/restore, retained and missing KEKs
        shell: bash
        run: bash tests/restore/restore-rehearsal.sh
      - name: Independent-cluster PostgreSQL restore and role recovery gate
        shell: bash
        run: bash tests/restore/cross-cluster-rehearsal.sh
      - name: Physical pg_basebackup + archived WAL point-in-time recovery gate
        shell: bash
        run: bash tests/restore/physical-pitr-rehearsal.sh
      - name: Physical THIRD-PGDATA claim WAL PITR must fail against surviving FOURTH
        shell: bash
        run: bash tests/restore/physical-third-claim-pitr-rehearsal.sh
      - name: Physical FOURTH-PGDATA claim WAL PITR must fail against surviving THIRD
        shell: bash
        run: bash tests/restore/physical-fourth-claim-pitr-rehearsal.sh
      - name: Physical DUAL-PGDATA claim WAL PITR exposes unsafe replay without external fence
        shell: bash
        run: bash tests/restore/physical-dual-claim-pitr-rehearsal.sh
      - name: Stop disposable database
        if: always()
        run: |
          docker rm -f omnia-ci-fourth-claim-fence || true
          docker rm -f omnia-ci-witness-anchor || true
          docker rm -f omnia-ci-erasure-witness || true
          docker rm -f omnia-ci-pg || true
      - name: Validate Docker Compose
        run: docker compose --env-file docker/.env.example -f docker/compose.yml config --quiet
      - name: Build API container
        run: docker build -f docker/Dockerfile.api -t omnia-api:ci .
  mobile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Expo dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck React Native
        run: npm run typecheck
      - name: Vitest domain
        run: npm test
      - name: Export Expo web
        run: npm run build:web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright browser E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: omnia-browser-diagnostics
          path: |
            src/mobile/test-results
            src/mobile/playwright-report
          retention-days: 5
          if-no-files-found: ignore
