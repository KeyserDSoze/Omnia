name: Tao CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # CI=true: locked restore, and NuGet audit fails on high/critical advisories.
      - name: Locked restore with NuGet audit
        run: |
          set -euo pipefail
          for project in $(find src/backend tests -name '*.csproj' | sort); do
            dotnet restore "$project" --locked-mode
          done
      - name: Build API
        run: dotnet build src/backend/Tao.Api/Tao.Api.csproj -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/Tao.Domain.Tests/Tao.Domain.Tests.csproj -c Release
      - name: Start disposable PostgreSQL 17 / pgvector
        run: |
          set -euo pipefail
          admin="$(openssl rand -hex 24)"; app="$(openssl rand -hex 24)"; retention="$(openssl rand -hex 24)"
          echo "::add-mask::$admin"; echo "::add-mask::$app"; echo "::add-mask::$retention"
          {
            echo "TAO_TEST_DB=Host=127.0.0.1;Port=15432;Database=tao_test;Username=tao;Password=$admin"
            echo "TAO_TEST_APP_DB=Host=127.0.0.1;Port=15432;Database=tao_test;Username=tao_app;Password=$app"
            echo "TAO_TEST_RETENTION_DB=Host=127.0.0.1;Port=15432;Database=tao_test;Username=tao_retention;Password=$retention"
            echo "TAO_TEST_KEYRING_FILE=$RUNNER_TEMP/tao-test.keyring.json"
          } >> "$GITHUB_ENV"
          jq -nc --arg key "$(openssl rand -base64 32)" '{activeKeyId:"ci-v1", keys:{"ci-v1":$key}}' \
            > "$RUNNER_TEMP/tao-test.keyring.json"
          chmod 600 "$RUNNER_TEMP/tao-test.keyring.json"
          docker run -d --rm --name tao-ci-pg -e POSTGRES_USER=tao -e POSTGRES_DB=tao_test \
            -e "POSTGRES_PASSWORD=$admin" -p 127.0.0.1:15432:5432 pgvector/pgvector:pg17
          for i in $(seq 1 60); do
            docker exec tao-ci-pg pg_isready -U tao -d tao_test >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec -i tao-ci-pg psql -v ON_ERROR_STOP=1 -U tao -d tao_test \
            -v app_password="$app" -v retention_password="$retention" <<'SQL'
          SELECT format('CREATE ROLE tao_app LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE',
            :'app_password') \gexec
          SELECT format('CREATE ROLE tao_retention LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT',
            :'retention_password') \gexec
          SQL
      - name: Integration tests (real PostgreSQL, restricted roles)
        run: dotnet test tests/Tao.Integration.Tests/Tao.Integration.Tests.csproj -c Release
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f tao-ci-pg || true

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/mobile
    env:
      # E2E specs and GitHub Pages share the /Tao base path.
      TAO_WEB_BASE_PATH: /Tao
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: npm audit (fails on high/critical)
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - name: Metro bundles for Android and iOS (not signed native builds)
        run: |
          npx expo export --platform android --output-dir "$RUNNER_TEMP/tao-android"
          npx expo export --platform ios --output-dir "$RUNNER_TEMP/tao-ios"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: tao-web-diagnostics
          path: |
            src/mobile/test-results
            src/mobile/playwright-report
          retention-days: 5
          if-no-files-found: ignore

  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Backup and restore rehearsal on a disposable PostgreSQL
        shell: pwsh
        run: docker/db/test-backup-restore.ps1

  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Generate disposable on-prem configuration
        run: bash docker/setup.sh http://localhost:59800
      - name: Build and start the on-prem stack
        run: docker compose --env-file docker/.env -f docker/compose.yml up -d --build
      - name: Wait for the single-port gateway
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://localhost:59800/api/health >/dev/null 2>&1 && exit 0
            sleep 3
          done
          exit 1
      - name: Smoke test routing, OIDC discovery and security headers
        run: |
          set -euo pipefail
          base=http://localhost:59800
          curl -fsS "$base/healthz"
          curl -fsS "$base/api/health" | jq -e '.status == "ok"'
          curl -fsS "$base/auth/realms/tao/.well-known/openid-configuration" | jq -e \
            '.issuer == "http://localhost:59800/auth/realms/tao" and (.token_endpoint | startswith("http://localhost:59800/auth/"))'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/v1/memories")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/auth/admin/")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/auth/realms/master/")" = 404
          curl -fsSI "$base/" | grep -qi '^content-security-policy:'
      - name: Create a disposable Keycloak user
        run: |
          set -euo pipefail
          set -a; source docker/.env; set +a
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "TAO_E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "TAO_E2E_USER1=tao-ci-gateway" >> "$GITHUB_ENV"
          kc() { docker compose --env-file docker/.env -f docker/compose.yml exec -T keycloak /opt/keycloak/bin/kcadm.sh "$@"; }
          kc config credentials --server http://localhost:8080/auth --realm master \
            --user "$KEYCLOAK_ADMIN" --password "$KEYCLOAK_ADMIN_PASSWORD"
          kc create users -r tao -s username=tao-ci-gateway -s enabled=true -s emailVerified=true \
            -s email=tao-ci-gateway@example.test -s firstName=Tao -s lastName=CI
          kc set-password -r tao --username tao-ci-gateway --new-password "$password"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/mobile/package-lock.json
      - name: Browser login and note through the gateway
        working-directory: src/mobile
        env:
          TAO_GATEWAY_E2E: '1'
          TAO_E2E_BASE_URL: http://localhost:59800
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test e2e/gateway.spec.ts --reporter=line --retries=0
      - name: Diagnostics on failure
        if: failure()
        run: docker compose --env-file docker/.env -f docker/compose.yml logs --tail 80 api keycloak web
      - name: Stop the stack
        if: always()
        run: docker compose --env-file docker/.env -f docker/compose.yml down -v || true
