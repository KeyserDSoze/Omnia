name: Omnia native build (manual, credentials required)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    if: ${{ vars.OMNIA_NATIVE_BUILDS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: src/mobile
        run: npm install --no-audit --no-fund
      - name: Build Android and iOS with EAS (requires EXPO_TOKEN and store credentials)
        working-directory: src/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli build --platform all --profile preview --non-interactive --no-wait
