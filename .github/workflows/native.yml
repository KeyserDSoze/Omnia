name: Tao native build (manual, credentials required)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    if: ${{ vars.TAO_NATIVE_BUILDS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/mobile/package-lock.json
      - name: Install locked dependencies
        working-directory: src/mobile
        run: npm ci --no-audit --no-fund
      - name: Build Android and iOS with EAS (requires EXPO_TOKEN and store credentials)
        working-directory: src/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli build --platform all --profile preview --non-interactive --no-wait
