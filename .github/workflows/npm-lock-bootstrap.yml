name: Omnia one-time npm lockfile bootstrap (#188)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/npm-lock-bootstrap.yml
      - src/mobile/package.json
permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only the job that produces the reviewed root lockfile gets contents write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile with published metadata (no scripts)
        working-directory: src/mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Prove integrity and fresh npm ci installation
        working-directory: src/mobile
        run: |
          set -euo pipefail
          node --test scripts/mobile-lock-policy.test.mjs
          node scripts/verify-mobile-lockfile.mjs
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm run typecheck
          npm test
          npm run build:web
      - name: Check exact native peer versions after install
        working-directory: src/mobile
        run: npm ls react-native-reanimated react-native-worklets react-native-gesture-handler
      - name: Publish ONLY verified new lockfile on main via scoped GitHub Contents API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Main moved; refusing stale lockfile write." >&2
            exit 1
          fi
          test -f src/mobile/package-lock.json
          git add -- src/mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "No new lockfile change: refusing write." >&2
            exit 1
          fi
          changed="$(git diff --cached --name-only)"
          test "$changed" = "src/mobile/package-lock.json"
          payload="$RUNNER_TEMP/omnia-npm-lock-commit.json"
          trap 'rm -f "$payload"' EXIT
          node - <<'NODE'
          const {readFileSync, writeFileSync} = require('node:fs');
          const {join} = require('node:path');
          const body = {
            message: 'build(deps): commit tested npm 10 lock graph #188',
            branch: 'main',
            content: readFileSync('src/mobile/package-lock.json').toString('base64')
          };
          writeFileSync(join(process.env.RUNNER_TEMP, 'omnia-npm-lock-commit.json'),
            JSON.stringify(body), {mode: 0o600});
          NODE
          # GITHUB_TOKEN is used only here, after all npm scripts/tests. No force push.
          curl --fail-with-body -sS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary "@$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/src/mobile/package-lock.json" \
            | jq -e '.commit.sha | type == "string" and length == 40'
