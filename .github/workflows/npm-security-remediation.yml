name: Omnia controlled npm security override trial (#194)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/npm-security-remediation.yml
permissions:
  contents: read
jobs:
  try-fixes:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trial tightly scoped transitive security fixes
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = 'src/mobile/package.json';
          const pkg = JSON.parse(fs.readFileSync(manifest, 'utf8'));
          if (pkg.overrides && Object.keys(pkg.overrides).length) {
            throw new Error('Unexpected existing overrides: review required');
          }
          pkg.overrides = {
            'tinypool': '2.1.2',
            'decode-uri-component': '0.5.1'
          };
          fs.writeFileSync(manifest, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          cd src/mobile
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node scripts/verify-mobile-lockfile.mjs
          node --test scripts/mobile-lock-policy.test.mjs
          node - <<'NODE'
          const lock = require('./package-lock.json');
          if (lock.packages['node_modules/tinypool']?.version !== '2.1.2' ||
              lock.packages['node_modules/decode-uri-component']?.version !== '0.5.1') {
            throw new Error('npm package graph did not select reviewed override versions');
          }
          console.log('Confirmed transitively pinned patched versions');
          NODE
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build:web
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Require full npm ALL + PRODUCTION audit free of high and critical
        shell: bash
        run: |
          set -euo pipefail
          cd src/mobile
          for scope in all production; do
            status=0
            if [ "$scope" = production ]; then
              npm audit --json --omit=dev --audit-level=high > "$RUNNER_TEMP/audit-$scope.json" || status=$?
            else
              npm audit --json --audit-level=high > "$RUNNER_TEMP/audit-$scope.json" || status=$?
            fi
            python3 - "$RUNNER_TEMP/audit-$scope.json" "$scope" "$status" <<'PY'
          import json, sys
          doc=json.load(open(sys.argv[1], encoding='utf-8'))
          scope=sys.argv[2]
          status=int(sys.argv[3])
          if status not in (0,1) or doc.get('auditReportVersion') != 2 or doc.get('error'):
              raise RuntimeError('Registry npm audit unavailable or invalid')
          counts=doc.get('metadata',{}).get('vulnerabilities')
          if not isinstance(counts,dict) or counts.get('total') != len(doc.get('vulnerabilities',{})):
              raise RuntimeError('Invalid npm advisory count/schema')
          print(scope,'npm vulnerability counts:',counts)
          for package,info in doc['vulnerabilities'].items():
              if info.get('severity') in ('high','critical'):
                  print('UNRESOLVED:', package,info.get('severity'))
          if counts.get('high',0)>0 or counts.get('critical',0)>0 or status != 0:
              raise RuntimeError('Unresolved HIGH/CRITICAL npm advisories: do not commit')
          PY
          done
      - name: Commit ONLY verified security graph to main with nonforce atomic fast-forward
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path
          root=Path.cwd()
          repo=os.environ['GITHUB_REPOSITORY']
          sha=os.environ['GITHUB_SHA']
          base='https://api.github.com/repos/'+repo
          def gh(method,path,payload=None):
              data=None if payload is None else json.dumps(payload).encode('utf-8')
              req=urllib.request.Request(base+path,method=method,data=data,headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json',
                  'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=50) as resp:
                  return json.load(resp)
          current=gh('GET','/git/ref/heads/main')['object']['sha']
          assert current==sha,'main moved; do not publish a stale lock'
          head=gh('GET','/git/commits/'+current)
          paths=['src/mobile/package.json','src/mobile/package-lock.json']
          nodes=[]
          for p in paths:
              data=(root/p).read_bytes()
              assert data and json.loads(data),'invalid or missing JSON'
              blob=gh('POST','/git/blobs',{
                  'content':base64.b64encode(data).decode('ascii'),
                  'encoding':'base64'})
              nodes.append({'path':p,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=gh('POST','/git/trees',{'base_tree':head['tree']['sha'],'tree':nodes})
          commit=gh('POST','/git/commits',{
              'message':'fix(deps): security-pin reviewed npm transitive patches #194',
              'parents':[current],'tree':tree['sha']})
          result=gh('PATCH','/git/refs/heads/main',{
              'sha':commit['sha'],'force':False})
          assert result['object']['sha']==commit['sha'],'failed protected main update'
          print('Verified npm graph committed to main:',commit['sha'])
          PY
