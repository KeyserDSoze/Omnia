name: Omnia one-time NuGet lockfile bootstrap (#189)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nuget-lock-bootstrap.yml
permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Generate all NuGet lockfiles from official NuGet feed
        shell: bash
        run: |
          set -euo pipefail
          dotnet --version
          mapfile -d '' projects < <(find src/backend tests -type f -name '*.csproj' \
            ! -path '*/bin/*' ! -path '*/obj/*' -print0 | sort -z)
          echo "Detected ${#projects[@]} tracked dotnet projects"
          test "${#projects[@]}" -eq 20
          for project in "${projects[@]}"; do
            echo "::group::NuGet initial lock $project"
            dotnet restore "$project" --use-lock-file --force-evaluate \
              -p:RestoreLockedMode=false \
              --source https://api.nuget.org/v3/index.json --disable-parallel
            echo "::endgroup::"
          done
      - name: Test policy and independently verify all project locks using locked NuGet restore
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/quality -p 'test_nuget_lock.py'
          python3 tests/quality/verify_nuget_locks.py
          mapfile -d '' projects < <(find src/backend tests -type f -name '*.csproj' \
            ! -path '*/bin/*' ! -path '*/obj/*' -print0 | sort -z)
          test "${#projects[@]}" -eq 20
          for project in "${projects[@]}"; do
            echo "::group::NuGet locked restore $project"
            dotnet restore "$project" --locked-mode \
              --source https://api.nuget.org/v3/index.json --disable-parallel
            echo "::endgroup::"
          done
      - name: Build API and execute xUnit without implicit restore
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/backend/Omnia.Api/Omnia.Api.csproj -c Release --no-restore
          dotnet test tests/Omnia.Domain.Tests/Omnia.Domain.Tests.csproj -c Release --no-restore
      - name: Publish ONLY 20 validated NuGet lockfile blobs in one fast-forward commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          root = Path.cwd()
          projects = sorted([*root.glob("src/backend/**/*.csproj"), *root.glob("tests/**/*.csproj")])
          assert len(projects) == 20, "Unexpected NuGet project count"
          paths = [project.with_name("packages.lock.json").relative_to(root) for project in projects]
          assert len(paths) == len(set(paths)), "Duplicate NuGet lock paths"
          repo = os.environ["GITHUB_REPOSITORY"]
          expected = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repo}"

          def github(method, path, payload=None):
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  base + path, data=body, method=method,
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "Content-Type": "application/json"})
              with urllib.request.urlopen(request, timeout=45) as reply:
                  return json.load(reply)

          current = github("GET", "/git/ref/heads/main")["object"]["sha"]
          assert current == expected, "main moved; refusing stale NuGet lock commit"
          parent = github("GET", f"/git/commits/{current}")
          elements = []
          for path in paths:
              content = (root / path).read_bytes()
              payload = json.loads(content)
              assert isinstance(payload.get("dependencies"), dict) and payload["dependencies"]
              blob = github("POST", "/git/blobs", {
                  "content": base64.b64encode(content).decode("ascii"),
                  "encoding": "base64"
              })
              elements.append({
                  "path": str(path), "mode": "100644",
                  "type": "blob", "sha": blob["sha"]
              })
          tree = github("POST", "/git/trees", {
              "base_tree": parent["tree"]["sha"], "tree": elements
          })
          commit = github("POST", "/git/commits", {
              "message": "build(deps): check in 20 validated NuGet lock graphs #189",
              "parents": [current], "tree": tree["sha"]
          })
          # REST Git ref rejects a non-fast-forward. Never use force.
          result = github("PATCH", "/git/refs/heads/main", {
              "sha": commit["sha"], "force": False
          })
          assert result["object"]["sha"] == commit["sha"]
          print("Published 20 NuGet locks, commit", commit["sha"])
          PY
