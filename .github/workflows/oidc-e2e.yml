name: Tao OIDC real-browser E2E
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  oidc-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/mobile/package-lock.json

      - name: Verify exact .NET SDK from global.json
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/quality -p 'test_dotnet_toolchain.py'
          python3 tests/quality/verify_dotnet_toolchain.py
          python3 -m unittest discover -s tests/quality -p 'test_dotnet_image_pins.py'
          python3 tests/quality/verify_dotnet_image_pins.py --offline
          test "$(dotnet --version)" = "10.0.404"

      - name: Validate and restore API NuGet graph in locked mode
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/quality -p 'test_nuget_lock.py'
          python3 tests/quality/verify_nuget_locks.py
          dotnet restore src/backend/Tao.Api/Tao.Api.csproj --locked-mode

      - name: Start disposable PostgreSQL and Keycloak with random credentials
        shell: bash
        run: |
          set -euo pipefail
          pgpass="$(openssl rand -hex 24)"
          kcpass="$(openssl rand -hex 24)"
          userpass="$(openssl rand -hex 24)"
          apppass="$(openssl rand -hex 24)"
          retentionpass="$(openssl rand -hex 24)"
          echo "::add-mask::$pgpass"
          echo "::add-mask::$kcpass"
          echo "::add-mask::$userpass"
          echo "::add-mask::$apppass"
          echo "::add-mask::$retentionpass"
          {
            echo "TAO_E2E_PG_PASSWORD=$pgpass"
            echo "TAO_E2E_APP_PASSWORD=$apppass"
            echo "TAO_E2E_RETENTION_PASSWORD=$retentionpass"
            echo "TAO_E2E_KEYRING_FILE=$RUNNER_TEMP/tao-e2e-envelope.keyring.json"
            echo "TAO_E2E_KC_PASSWORD=$kcpass"
            echo "TAO_E2E_PASSWORD=$userpass"
            echo "TAO_E2E_USER1=tao-ci-one"
            echo "TAO_E2E_USER2=tao-ci-two"
            echo "TAO_E2E_USER3=tao-ci-three"
          } >> "$GITHUB_ENV"
          ring_key="$(openssl rand -base64 32)"
          jq -nc --arg secret "$ring_key" \
            '{activeKeyId:"e2e-v1", keys:{"e2e-v1":$secret}}' \
            > "$RUNNER_TEMP/tao-e2e-envelope.keyring.json"
          chmod 600 "$RUNNER_TEMP/tao-e2e-envelope.keyring.json"

          docker run -d --rm --name tao-oidc-pg \
            -e POSTGRES_USER=tao -e POSTGRES_DB=tao_test \
            -e "POSTGRES_PASSWORD=$pgpass" \
            -p 127.0.0.1:15432:5432 pgvector/pgvector:pg17
          docker run -d --rm --name tao-oidc-keycloak \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=ci-admin \
            -e "KC_BOOTSTRAP_ADMIN_PASSWORD=$kcpass" \
            -v "$GITHUB_WORKSPACE/docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro" \
            -p 127.0.0.1:8081:8080 quay.io/keycloak/keycloak:26.4 \
            start-dev --import-realm --hostname=http://localhost:8081

          for i in $(seq 1 90); do
            if docker exec tao-oidc-pg pg_isready -U tao -d tao_test >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec tao-oidc-pg pg_isready -U tao -d tao_test
          docker exec -i tao-oidc-pg psql -v ON_ERROR_STOP=1 \
            -U tao -d tao_test -v app_password="$apppass" -v retention_password="$retentionpass" <<'SQL'
          SELECT format(
            'CREATE ROLE tao_app LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE',
            :'app_password'
          ) \gexec
          SELECT format(
            'CREATE ROLE tao_retention LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT',
            :'retention_password'
          ) \gexec
          SQL

          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8081/realms/tao/.well-known/openid-configuration >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8081/realms/tao/.well-known/openid-configuration \
            | jq -e '.issuer == "http://localhost:8081/realms/tao"'

      - name: Provision synthetic identities through Keycloak admin API
        shell: bash
        run: |
          set -euo pipefail
          admin_token="$(curl -fsS -X POST \
            http://localhost:8081/realms/master/protocol/openid-connect/token \
            --data-urlencode 'grant_type=password' \
            --data-urlencode 'client_id=admin-cli' \
            --data-urlencode 'username=ci-admin' \
            --data-urlencode "password=$TAO_E2E_KC_PASSWORD" \
            | jq -r '.access_token')"
          test "${#admin_token}" -gt 40
          echo "::add-mask::$admin_token"

          # Each actor signs in via genuine PKCE/JWT. The third disposable
          # subject isolates late paging E2E from prior actors' real 429 quota.
          for username in "$TAO_E2E_USER1" "$TAO_E2E_USER2" "$TAO_E2E_USER3"; do
            body="$(jq -nc --arg username "$username" --arg password "$TAO_E2E_PASSWORD" \
              '{username: $username, firstName: "Tao", lastName: "Synthetic", email: ($username + "@example.test"), emailVerified: true, requiredActions: [], enabled: true, credentials: [{type:"password", value:$password, temporary:false}]}')"
            curl -fsS -X POST http://localhost:8081/admin/realms/tao/users \
              -H "Authorization: Bearer $admin_token" \
              -H "Content-Type: application/json" \
              --data-binary "$body"
          done

      - name: Launch real .NET 10 API (OIDC bearer + PostgreSQL migrations)
        shell: bash
        run: |
          set -euo pipefail
          export Database__ConnectionString="Host=127.0.0.1;Port=15432;Database=tao_test;Username=tao_app;Password=$TAO_E2E_APP_PASSWORD"
          export Database__MigrationConnectionString="Host=127.0.0.1;Port=15432;Database=tao_test;Username=tao;Password=$TAO_E2E_PG_PASSWORD"
          export Database__RetentionConnectionString="Host=127.0.0.1;Port=15432;Database=tao_test;Username=tao_retention;Password=$TAO_E2E_RETENTION_PASSWORD"
          export Crypto__KeyRingPath="$TAO_E2E_KEYRING_FILE"
          export Auth__Issuer=http://localhost:8081/realms/tao
          export Auth__Audience=tao-api
          export Embeddings__Provider=none
          export Cors__Origins__0=http://127.0.0.1:19006
          export ASPNETCORE_ENVIRONMENT=Development
          export ASPNETCORE_URLS=http://127.0.0.1:8080
          # This state is owned by the ephemeral test operator, not restored
          # from PGDATA or exposed in the web/API bundle.
          export Recovery__AccessStateFile="$RUNNER_TEMP/tao-oidc-recovery-state"
          printf 'ready\n' > "$Recovery__AccessStateFile"
          chmod 600 "$Recovery__AccessStateFile"
          nohup dotnet run --project src/backend/Tao.Api/Tao.Api.csproj \
            --configuration Release --no-launch-profile \
            > "$RUNNER_TEMP/tao-oidc-api.log" 2>&1 < /dev/null &
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/tao-oidc-api.log"
          exit 1

      - name: Running API blocks access immediately when recovery quarantine is activated
        shell: bash
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/tao-oidc-recovery-state"
          body="$(mktemp "$RUNNER_TEMP/tao-quarantine-response.XXXXXX")"
          trap 'rm -f "$body"' EXIT
          printf 'quarantined\n' > "$marker"
          chmod 600 "$marker"
          code="$(curl -sS -o "$body" -w '%{http_code}' http://127.0.0.1:8080/health)"
          [[ "$code" == 503 ]] || { echo "Quarantined API still served traffic." >&2; exit 1; }
          jq -e '.error == "recovery_quarantined"' "$body" >/dev/null
          code="$(curl -sS -o "$body" -w '%{http_code}' http://127.0.0.1:8080/api/v1/memories)"
          [[ "$code" == 503 ]] || { echo "Quarantined API exposed a personal-data route." >&2; exit 1; }
          printf 'ready\n' > "$marker"
          curl -fsS http://127.0.0.1:8080/health | jq -e '.status == "ok"' >/dev/null

      - name: Install locked web dependencies
        working-directory: src/mobile
        run: node scripts/verify-mobile-lockfile.mjs && node scripts/verify-sdk58-security.mjs && npm ci --no-audit --no-fund

      - name: Build static Expo for actual OIDC + API
        working-directory: src/mobile
        env:
          EXPO_PUBLIC_TAO_OIDC_ISSUER: http://localhost:8081/realms/tao
          EXPO_PUBLIC_TAO_OIDC_CLIENT_ID: tao-web
          EXPO_PUBLIC_TAO_API_URL: http://127.0.0.1:8080
        run: npm run typecheck && npm run build:web

      - name: Install Chromium
        working-directory: src/mobile
        run: npx playwright install --with-deps chromium

      - name: Playwright browser real PKCE, JWT, consent, sync, cross-user
        working-directory: src/mobile
        env:
          TAO_REAL_OIDC_E2E: '1'
        run: npx playwright test e2e/auth-sync.spec.ts --reporter=line --retries=0

      - name: Capture safe diagnostics on failure
        if: failure()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/tao-oidc-api.log"; then
            tail -n 120 "$RUNNER_TEMP/tao-oidc-api.log" | sed -E 's/(Password=)[^; ]+/\1***/g'
          fi
          docker logs --tail 100 tao-oidc-keycloak 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tao-oidc-browser-diagnostics
          path: |
            src/mobile/test-results
            src/mobile/playwright-report
          if-no-files-found: ignore
          retention-days: 5

      - name: Cleanup disposable test services
        if: always()
        run: |
          docker rm -f tao-oidc-pg tao-oidc-keycloak || true
