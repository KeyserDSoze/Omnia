name: Omnia OIDC real-browser E2E
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  oidc-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start disposable PostgreSQL and Keycloak with random credentials
        shell: bash
        run: |
          set -euo pipefail
          pgpass="$(openssl rand -hex 24)"
          kcpass="$(openssl rand -hex 24)"
          userpass="$(openssl rand -hex 24)"
          apppass="$(openssl rand -hex 24)"
          echo "::add-mask::$pgpass"
          echo "::add-mask::$kcpass"
          echo "::add-mask::$userpass"
          echo "::add-mask::$apppass"
          {
            echo "OMNIA_E2E_PG_PASSWORD=$pgpass"
            echo "OMNIA_E2E_APP_PASSWORD=$apppass"
            echo "OMNIA_E2E_KC_PASSWORD=$kcpass"
            echo "OMNIA_E2E_PASSWORD=$userpass"
            echo "OMNIA_E2E_USER1=omnia-ci-one"
            echo "OMNIA_E2E_USER2=omnia-ci-two"
          } >> "$GITHUB_ENV"

          docker run -d --rm --name omnia-oidc-pg \
            -e POSTGRES_USER=omnia -e POSTGRES_DB=omnia_test \
            -e "POSTGRES_PASSWORD=$pgpass" \
            -p 127.0.0.1:15432:5432 pgvector/pgvector:pg17
          docker run -d --rm --name omnia-oidc-keycloak \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=ci-admin \
            -e "KC_BOOTSTRAP_ADMIN_PASSWORD=$kcpass" \
            -v "$GITHUB_WORKSPACE/docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro" \
            -p 127.0.0.1:8081:8080 quay.io/keycloak/keycloak:26.4 \
            start-dev --import-realm --hostname=http://localhost:8081

          for i in $(seq 1 90); do
            if docker exec omnia-oidc-pg pg_isready -U omnia -d omnia_test >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec omnia-oidc-pg pg_isready -U omnia -d omnia_test
          docker exec -i omnia-oidc-pg psql -v ON_ERROR_STOP=1 \
            -U omnia -d omnia_test -v app_password="$apppass" <<'SQL'
          SELECT format(
            'CREATE ROLE omnia_app LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE',
            :'app_password'
          ) \gexec
          SQL

          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8081/realms/omnia/.well-known/openid-configuration >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8081/realms/omnia/.well-known/openid-configuration \
            | jq -e '.issuer == "http://localhost:8081/realms/omnia"'

      - name: Provision synthetic identities through Keycloak admin API
        shell: bash
        run: |
          set -euo pipefail
          admin_token="$(curl -fsS -X POST \
            http://localhost:8081/realms/master/protocol/openid-connect/token \
            --data-urlencode 'grant_type=password' \
            --data-urlencode 'client_id=admin-cli' \
            --data-urlencode 'username=ci-admin' \
            --data-urlencode "password=$OMNIA_E2E_KC_PASSWORD" \
            | jq -r '.access_token')"
          test "${#admin_token}" -gt 40
          echo "::add-mask::$admin_token"

          for username in "$OMNIA_E2E_USER1" "$OMNIA_E2E_USER2"; do
            body="$(jq -nc --arg username "$username" --arg password "$OMNIA_E2E_PASSWORD" \
              '{username: $username, firstName: "Omnia", lastName: "Synthetic", email: ($username + "@example.test"), emailVerified: true, requiredActions: [], enabled: true, credentials: [{type:"password", value:$password, temporary:false}]}')"
            curl -fsS -X POST http://localhost:8081/admin/realms/omnia/users \
              -H "Authorization: Bearer $admin_token" \
              -H "Content-Type: application/json" \
              --data-binary "$body"
          done

      - name: Launch real .NET 10 API (OIDC bearer + PostgreSQL migrations)
        shell: bash
        run: |
          set -euo pipefail
          export Database__ConnectionString="Host=127.0.0.1;Port=15432;Database=omnia_test;Username=omnia_app;Password=$OMNIA_E2E_APP_PASSWORD"
          export Database__MigrationConnectionString="Host=127.0.0.1;Port=15432;Database=omnia_test;Username=omnia;Password=$OMNIA_E2E_PG_PASSWORD"
          export Auth__Issuer=http://localhost:8081/realms/omnia
          export Auth__Audience=omnia-api
          export Embeddings__Provider=none
          export Cors__Origins__0=http://127.0.0.1:19006
          export ASPNETCORE_ENVIRONMENT=Development
          export ASPNETCORE_URLS=http://127.0.0.1:8080
          nohup dotnet run --project src/backend/Omnia.Api/Omnia.Api.csproj \
            --configuration Release --no-launch-profile \
            > "$RUNNER_TEMP/omnia-oidc-api.log" 2>&1 < /dev/null &
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/omnia-oidc-api.log"
          exit 1

      - name: Install web dependencies
        working-directory: src/mobile
        run: npm install --no-audit --no-fund

      - name: Build static Expo for actual OIDC + API
        working-directory: src/mobile
        env:
          EXPO_PUBLIC_OMNIA_OIDC_ISSUER: http://localhost:8081/realms/omnia
          EXPO_PUBLIC_OMNIA_OIDC_CLIENT_ID: omnia-web
          EXPO_PUBLIC_OMNIA_API_URL: http://127.0.0.1:8080
        run: npm run typecheck && npm run build:web

      - name: Install Chromium
        working-directory: src/mobile
        run: npx playwright install --with-deps chromium

      - name: Playwright browser real PKCE, JWT, consent, sync, cross-user
        working-directory: src/mobile
        env:
          OMNIA_REAL_OIDC_E2E: '1'
        run: npx playwright test e2e/auth-sync.spec.ts --reporter=line

      - name: Capture safe diagnostics on failure
        if: failure()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/omnia-oidc-api.log"; then
            tail -n 120 "$RUNNER_TEMP/omnia-oidc-api.log" | sed -E 's/(Password=)[^; ]+/\1***/g'
          fi
          docker logs --tail 100 omnia-oidc-keycloak 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: omnia-oidc-browser-diagnostics
          path: |
            src/mobile/test-results
            src/mobile/playwright-report
          if-no-files-found: ignore
          retention-days: 5

      - name: Cleanup disposable test services
        if: always()
        run: |
          docker rm -f omnia-oidc-pg omnia-oidc-keycloak || true
