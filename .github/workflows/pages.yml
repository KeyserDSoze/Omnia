name: Tao GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: tao-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/mobile/package-lock.json
      # With the repository variables TAO_CLOUD_ISSUER and TAO_CLOUD_API_URL (set from the Azure deployment)
      # the bundle talks to the real back end; without them it runs in the local demo mode.
      - name: Build Expo web for the custom domain (taoai.me)
        working-directory: src/mobile
        env:
          TAO_WEB_BASE_PATH: ''
          TAO_SITE_URL: https://taoai.me
          EXPO_PUBLIC_TAO_OIDC_ISSUER: ${{ vars.TAO_CLOUD_ISSUER }}
          EXPO_PUBLIC_TAO_OIDC_CLIENT_ID: ${{ vars.TAO_CLOUD_ISSUER != '' && 'tao-web' || '' }}
          EXPO_PUBLIC_TAO_API_URL: ${{ vars.TAO_CLOUD_API_URL }}
        run: npm ci --no-audit --no-fund && npm run typecheck && npm run build:web
      - name: Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          case "$status" in
            200) echo "enabled=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "enabled=false" >> "$GITHUB_OUTPUT"
                 echo "Pages not enabled. Use Settings > Pages > Source: GitHub Actions." ;;
            *)   echo "Unexpected Pages API status $status" >&2; exit 1 ;;
          esac
      # A new artifact per workflow attempt avoids rerun name conflicts.
      # The separate deployment job consumes the ACTUAL output of the
      # completed build job; do not recalculate run_attempt on a partial rerun.
      - name: Choose unique artifact
        id: artifact
        if: steps.pages.outputs.enabled == 'true'
        run: echo "name=tao-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: src/mobile/dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      # deploy-pages uses the internal Actions artifact service; REST visibility
      # does NOT imply internal visibility. The prior job completion acts as
      # the publication boundary and a bounded grace period mitigates lag.
      - name: Allow artifact-service metadata propagation
        shell: bash
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
