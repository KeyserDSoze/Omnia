name: Omnia GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: omnia-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/mobile/package-lock.json
      - name: Build Expo web
        working-directory: src/mobile
        run: node scripts/verify-mobile-lockfile.mjs && node scripts/verify-sdk58-security.mjs && npm ci --no-audit --no-fund && npm run typecheck && npm run build:web
      - name: Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pages not enabled. Use Settings > Pages > Source: GitHub Actions."
          fi
      # A new artifact per workflow attempt avoids rerun name conflicts.
      # The separate deployment job consumes the ACTUAL output of the
      # completed build job; do not recalculate run_attempt on a partial rerun.
      - name: Choose unique artifact
        id: artifact
        if: steps.pages.outputs.enabled == 'true'
        run: echo "name=omnia-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: src/mobile/dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      # deploy-pages uses the internal Actions artifact service; REST visibility
      # does NOT imply internal visibility. The prior job completion acts as
      # the publication boundary and a bounded grace period mitigates lag.
      - name: Allow artifact-service metadata propagation
        shell: bash
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
