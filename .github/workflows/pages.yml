name: Omnia GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: omnia-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Expo web
        working-directory: src/mobile
        run: npm install --no-audit --no-fund && npm run typecheck && npm run build:web
      - name: Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pages not enabled. Use Settings > Pages > Source: GitHub Actions."
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      # A rerun of a failed deployment must not create a second artifact
      # with the same name in the same workflow run (issue #142).
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          name: omnia-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/mobile/dist
      - name: Wait for exactly one visible Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: omnia-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Deploy Pages obtains artifact metadata through GitHub's API.
          # Successful upload alone can precede API visibility.
          for attempt in $(seq 1 20); do
            artifacts="$(curl --fail --silent --show-error \
              --retry 2 --retry-delay 1 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")"
            matches="$(jq -r --arg name "$ARTIFACT_NAME" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
              <<< "$artifacts")"
            if [[ "$matches" == 1 ]]; then
              echo "Pages artifact visible."
              exit 0
            fi
            if [[ "$matches" != 0 ]]; then
              echo "Pages artifact is ambiguous; refusing deployment." >&2
              exit 1
            fi
            sleep 2
          done
          echo "Pages artifact not visible within bounded wait." >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          artifact_name: omnia-pages-${{ github.run_id }}-${{ github.run_attempt }}
