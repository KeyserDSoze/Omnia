name: Omnia one-time advisory discovery (#193)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/security-advisory-discovery.yml
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Read-only official npm advisory result
        shell: bash
        run: |
          set -euo pipefail
          status=0
          (cd src/mobile && npm audit --json --audit-level=high --registry=https://registry.npmjs.org) > "$RUNNER_TEMP/npm-audit.json" 2> "$RUNNER_TEMP/npm-audit.err" || status=$?
          echo "npm scanner status=$status"
          python3 - "$RUNNER_TEMP/npm-audit.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          print("npm keys:", sorted(data.keys()))
          print("npm auditReportVersion:", data.get("auditReportVersion"))
          print("npm metadata:", data.get("metadata",{}).get("vulnerabilities"))
          for name,p in data.get("vulnerabilities",{}).items():
              print("npm finding:",name,"severity=",p.get("severity"),"via=",
                    [(x.get("url"), x.get("severity")) if isinstance(x,dict) else x
                     for x in p.get("via",[])][:5])
          if data.get("error"): raise RuntimeError("npm advisory feed error")
          PY
          test "$status" -le 1
      - name: Read-only NuGet vulnerability report for one locked project
        shell: bash
        run: |
          set -euo pipefail
          project=tests/Omnia.Domain.Tests/Omnia.Domain.Tests.csproj
          dotnet restore "$project" --locked-mode
          dotnet package list "$project" --vulnerable --include-transitive \
            --format json --output-version 1 --no-restore > "$RUNNER_TEMP/nuget-scan.json"
          python3 - "$RUNNER_TEMP/nuget-scan.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          print("NuGet report keys:", sorted(data.keys()))
          print("NuGet version:",data.get("version"),"parameters:",data.get("parameters"))
          for project in data.get("projects",[]):
              print("NuGet project:",project.get("path"))
              for framework in project.get("frameworks",[]):
                  print("NuGet framework:",framework.get("framework"),"groups:",sorted(framework.keys()))
                  for kind in ("topLevelPackages","transitivePackages"):
                      print("NuGet",kind,"count:",len(framework.get(kind,[])))
                      for p in framework.get(kind,[]):
                          if p.get("vulnerabilities"):
                              print("NuGet advisory:",p.get("id"),p.get("resolvedVersion"),
                                    p.get("vulnerabilities"))
          PY
