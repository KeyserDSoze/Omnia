name: tao
# On-prem stack: a single public port (TAO_HTTP_PORT, default 59800) served by the nginx
# gateway -> web app on /, .NET API on /api/, Keycloak on /auth/.
# Put TLS in front (e.g. Cloudflare Tunnel to http://127.0.0.1:59800, or the `tunnel` profile below).

# Bounded container logs: without a limit Docker keeps them until the disk is full.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: tao
      POSTGRES_USER: tao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tao -d tao"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    restart: unless-stopped

  db-bootstrap:
    image: pgvector/pgvector:pg17
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: tao
      PGUSER: tao
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in docker/.env}
      RETENTION_DB_PASSWORD: ${RETENTION_DB_PASSWORD:?Set RETENTION_DB_PASSWORD in docker/.env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in docker/.env}
    volumes:
      - ./db/bootstrap.sh:/opt/tao/bootstrap.sh:ro
    entrypoint: ["bash", "/opt/tao/bootstrap.sh"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command:
      - start
      - --import-realm
      - --http-enabled=true
      - --http-relative-path=/auth
      - --proxy-headers=xforwarded
      - --hostname=${TAO_PUBLIC_URL:?Set TAO_PUBLIC_URL in docker/.env}/auth
      # Admin console only on the host-local port, never through the public gateway.
      - --hostname-admin=http://localhost:${TAO_KEYCLOAK_ADMIN_PORT:-59801}/auth
      # The API fetches OIDC metadata/JWKS on the internal network.
      - --hostname-backchannel-dynamic=true
      - --health-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in docker/.env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in docker/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in docker/.env}
      # Placeholders resolved by the realm import (docker/keycloak/tao-realm.json).
      TAO_PUBLIC_URL: ${TAO_PUBLIC_URL}
      TAO_TENANT_ID: ${TAO_TENANT_ID:-default}
    volumes:
      - ./keycloak/tao-realm.json:/opt/keycloak/data/import/tao-realm.json:ro
      - ./keycloak/themes/tao:/opt/keycloak/themes/tao:ro
    ports:
      - "127.0.0.1:${TAO_KEYCLOAK_ADMIN_PORT:-59801}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      db-bootstrap: { condition: service_completed_successfully }
    logging: *logging
    restart: unless-stopped

  # Applied at every start: social login (TAO_SOCIAL_LOGIN), the only sign-in once a provider is set.
  keycloak-config:
    image: quay.io/keycloak/keycloak:26.4
    entrypoint: ["bash", "/opt/tao/configure.sh"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      TAO_SOCIAL_LOGIN: ${TAO_SOCIAL_LOGIN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_HOSTED_DOMAIN: ${GOOGLE_HOSTED_DOMAIN:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-organizations}
    volumes:
      - ./keycloak/configure.sh:/opt/tao/configure.sh:ro
    depends_on:
      keycloak: { condition: service_healthy }
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: Host=db;Port=5432;Database=tao;Username=tao_app;Password=${APP_DB_PASSWORD}
      Database__MigrationConnectionString: Host=db;Port=5432;Database=tao;Username=tao;Password=${POSTGRES_PASSWORD}
      Database__RetentionConnectionString: Host=db;Port=5432;Database=tao;Username=tao_retention;Password=${RETENTION_DB_PASSWORD}
      Crypto__KeyRingPath: /run/secrets/tao-envelope.keyring.json
      Auth__Issuer: ${TAO_PUBLIC_URL}/auth/realms/tao
      Auth__MetadataAddress: http://keycloak:8080/auth/realms/tao/.well-known/openid-configuration
      Auth__Audience: tao-api
      Auth__SocialProviders: ${TAO_SOCIAL_LOGIN:-}
      Tao__PublicBaseUrl: ${TAO_PUBLIC_URL}
      Connectors__Microsoft__ClientId: ${MICROSOFT_CLIENT_ID:-}
      Connectors__Microsoft__ClientSecret: ${MICROSOFT_CLIENT_SECRET:-}
      Connectors__Microsoft__Tenant: ${MICROSOFT_TENANT:-organizations}
      Connectors__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Connectors__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Llm__Endpoint: ${LLM_ENDPOINT:-}
      Llm__ApiKey: ${LLM_API_KEY:-}
      Llm__Model: ${LLM_MODEL:-}
      Llm__AuthHeader: ${LLM_AUTH_HEADER:-bearer}
      Llm__DailyCallsPerUser: ${LLM_DAILY_CALLS_PER_USER:-20}
      Llm__DailyTokensPerUser: ${LLM_DAILY_TOKENS_PER_USER:-200000}
      Llm__MaxOutputTokens: ${LLM_MAX_OUTPUT_TOKENS:-700}
      Ai__SpeechToText: ${TAO_SPEECH_TO_TEXT:-browser}
      Ai__TextToSpeech: ${TAO_TEXT_TO_SPEECH:-browser}
      Embeddings__Provider: ${EMBEDDINGS_PROVIDER:-none}
      Embeddings__Endpoint: ${EMBEDDINGS_ENDPOINT:-}
      Embeddings__Model: ${EMBEDDINGS_MODEL:-nomic-embed-text}
    volumes:
      - ${TAO_KEYRING_FILE:-./secrets/envelope.keyring.json}:/run/secrets/tao-envelope.keyring.json:ro
    depends_on:
      db: { condition: service_healthy }
      db-bootstrap: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
    # The runtime image has bash but no curl: a plain TCP request to the liveness endpoint.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      # Bind to all interfaces only if the tunnel runs on another machine (TAO_HTTP_BIND=0.0.0.0).
      - "${TAO_HTTP_BIND:-127.0.0.1}:${TAO_HTTP_PORT:-59800}:8080"
    depends_on:
      api: { condition: service_started }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging
    restart: unless-stopped

  # Optional local models: docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:0.40.18
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  # Public access: docker compose --profile tunnel up -d
  # A Cloudflare named tunnel (token from the Zero Trust dashboard) with the public hostname pointing at
  # http://web:8080. TAO_PUBLIC_URL must be that same https hostname.
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      web: { condition: service_healthy }
    logging: *logging
    restart: unless-stopped

  # Scheduled backups: docker compose --profile scheduled-backup up -d
  # One backup now and then every TAO_BACKUP_INTERVAL_HOURS (default 24), keeping TAO_BACKUP_KEEP.
  backup-scheduled:
    image: pgvector/pgvector:pg17
    profiles: ["scheduled-backup"]
    environment:
      PGHOST: db
      PGUSER: tao
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
      TAO_BACKUP_KEEP: ${TAO_BACKUP_KEEP:-14}
      TAO_BACKUP_INTERVAL_HOURS: ${TAO_BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ./db/backup.sh:/opt/tao/backup.sh:ro
      - ./db/backup-loop.sh:/opt/tao/backup-loop.sh:ro
      - ${TAO_BACKUP_DIR:-./backups}:/backups
    entrypoint: ["bash", "/opt/tao/backup-loop.sh"]
    depends_on:
      db: { condition: service_healthy }
    logging: *logging
    restart: unless-stopped

  # On demand: docker compose --profile backup run --rm backup
  # Dumps of the tao and keycloak databases into TAO_BACKUP_DIR (the key ring is not included).
  backup:
    image: pgvector/pgvector:pg17
    profiles: ["backup"]
    environment:
      PGHOST: db
      PGUSER: tao
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
      TAO_BACKUP_KEEP: ${TAO_BACKUP_KEEP:-14}
    volumes:
      - ./db/backup.sh:/opt/tao/backup.sh:ro
      - ${TAO_BACKUP_DIR:-./backups}:/backups
    entrypoint: ["bash", "/opt/tao/backup.sh"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  # docker compose stop web api keycloak; docker compose --profile backup run --rm restore tao-<timestamp> --yes
  restore:
    image: pgvector/pgvector:pg17
    profiles: ["backup"]
    environment:
      PGHOST: db
      PGUSER: tao
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - ./db/restore.sh:/opt/tao/restore.sh:ro
      - ${TAO_BACKUP_DIR:-./backups}:/backups:ro
    entrypoint: ["bash", "/opt/tao/restore.sh"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

volumes:
  pgdata:
  ollama:
