name: omnia
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: omnia
      POSTGRES_USER: omnia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnia -d omnia"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--hostname=http://localhost:8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "127.0.0.1:8081:8080"
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: Host=db;Port=5432;Database=omnia;Username=omnia;Password=${POSTGRES_PASSWORD}
      Auth__Issuer: http://localhost:8081/realms/omnia
      Auth__MetadataAddress: http://keycloak:8080/realms/omnia/.well-known/openid-configuration
      Auth__Audience: omnia-api
      Embeddings__Provider: ${EMBEDDINGS_PROVIDER:-none}
      Embeddings__Endpoint: http://ollama:11434/
      Embeddings__Model: nomic-embed-text
      Cors__Origins__0: http://localhost:19006
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db: { condition: service_healthy }
      keycloak: { condition: service_started }
volumes:
  pgdata:
  ollama:
