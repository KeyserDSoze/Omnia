# Tao on-prem gateway: one port for the web app (/), the .NET API (/api/)
# and Keycloak (/auth/). TLS terminates in front (e.g. Cloudflare Tunnel).

# Trust only an https marker from the tunnel; otherwise use the connection scheme.
map $http_x_forwarded_proto $tao_forwarded_proto {
    default $scheme;
    https   https;
}

map $tao_forwarded_proto $tao_hsts {
    default "";
    https   "max-age=31536000";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Docker DNS at request time, so restarted containers with new IPs are found.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $tao_api http://api:8080;
    set $tao_keycloak http://keycloak:8080;

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /+not-found.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/health {
        rewrite ^ /health break;
        proxy_pass $tao_api;
        include /etc/nginx/tao-proxy.inc;
    }

    location /api/ {
        proxy_pass $tao_api;
        include /etc/nginx/tao-proxy.inc;
        proxy_read_timeout 120s;
        # Streamed personal-data export and future event streams.
        proxy_buffering off;
    }

    # Keycloak administration stays on the host-only admin port.
    location ^~ /auth/admin/ { return 404; }
    location ^~ /auth/realms/master/ { return 404; }

    location /auth/ {
        proxy_pass $tao_keycloak;
        include /etc/nginx/tao-proxy.inc;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        # The sha256 is Expo Router's inline hydration flag (checked at image build).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-67fhrP0+BkBqmgGGXTtgiVO/9EQs3QruYNU/7fnRkI8='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Strict-Transport-Security $tao_hsts always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/index.html =404;
    }
}
